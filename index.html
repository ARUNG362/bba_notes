<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> <title>Subjects</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f4f6f8;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #2563eb;
            color: white;
            padding: 18px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }

        /* Content */
        .content {
            padding: 16px;
        }

        .status {
            text-align: center;
            padding: 30px 15px;
            color: #6b7280;
            font-size: 15px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        /* Subject Card */
        .subject-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
            transition: transform 0.15s ease;
        }

        .subject-card:active {
            transform: scale(0.98);
        }

        .subject-title {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
        }

        .subject-details {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .detail-key {
            color: #6b7280;
        }

        .detail-value {
            color: #374151;
            font-weight: 500;
            text-align: right;
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Refresh */
        .refresh-container {
            padding: 0 16px 20px;
        }

        .refresh-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-btn:active {
            background: #1d4ed8;
        }

        .refresh-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        /* Desktop */
        @media (min-width: 601px) {
            body {
                padding: 20px 0;
            }

            .app {
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>BBA Sem 3</h1>
            <p id="subtitle">Subject Notes</p>
        </header>

        <main class="content">

            <div id="errorContainer"></div>

            <div id="subjectsContainer">
                <div class="status">
                    Loading subjects...
                </div>
            </div>

        </main>

    </div>
</body>
    <script src="script.js"></script>
</html>
